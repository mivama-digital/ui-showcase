name: Sync latest Mivama UI

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: ui-showcase-sync-ui
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout showcase
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh @mivama/ui main lock
        id: refresh
        run: |
          npm update @mivama/ui --package-lock-only --ignore-scripts
          if git diff --quiet -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install refreshed dependency graph
        if: steps.refresh.outputs.changed == 'true'
        run: npm ci

      - name: Validate latest UI compatibility
        if: steps.refresh.outputs.changed == 'true'
        run: |
          npm run lint
          npm run typecheck
          npm run check:ui-coverage
          npm run doctor
          npm run build

      - name: Commit verified UI lock update
        if: steps.refresh.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync @mivama/ui main"
          git push origin HEAD:main
